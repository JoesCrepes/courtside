[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "courtside"
version = "0.1.0"
description = "Alternative client for ESPN Fantasy Basketball"
requires-python = ">=3.10"
# fastapi is here (not an extra) because Vercel installs only these.
dependencies = ["requests>=2.31", "fastapi>=0.115"]

[project.optional-dependencies]
dev = ["pytest>=8", "responses>=0.25", "httpx>=0.27"]

[project.scripts]
courtside = "courtside.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
